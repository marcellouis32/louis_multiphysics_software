[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lms"
version = "0.0.1"
description = "Multiphysics transport-phenomena solver for stirred-tank scale-up"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
gpu = ["taichi>=1.7"]
gpu-cuda = ["warp-lang>=1.0"]
geometry = ["trimesh>=4.0", "rtree>=1.2"]
viz = ["pyvista>=0.43"]
ml = ["torch>=2.2", "scikit-learn>=1.4", "zarr>=2.17", "pandas>=2.2"]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
lms = "lms.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lms"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running validation runs, excluded from the default suite"]
